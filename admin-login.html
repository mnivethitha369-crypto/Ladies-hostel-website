<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>
</div>

<script>
function login(){

    const password =
    document.getElementById("password").value;

    if(password === "NS123"){

        window.location.href = "admin.html";

    }else{

        alert("Wrong Password");

    }
}
</script>

</body>
</html>
