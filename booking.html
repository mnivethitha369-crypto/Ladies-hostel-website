<div class="video-banner">

        <source src="videos/banner.mp4" type="video/mp4">
    </video>

    <div class="banner-text">
        Book a Room
    </div>

</div>

    <section class="booking-section">
        <div class="booking-card">

            <h2>Book Your Room</h2>
 
            <form id="bookingForm">

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="number"
                    name="age"
                    placeholder="Age"
                    required
                >

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="date"
                    name="date"
                    required
                >

                <select name="room" required>
                    <option value="">Select Room Type</option>
                    <option value="Single Sharing">
                        Single Sharing
                    </option>
                    <option value="Double Sharing">
                        Double Sharing
                    </option>
                    <option value="Triple Sharing">
                        Triple Sharing
                    </option>
                    <option value="Ac Room">
                        Ac Room
                    </option>
                    <option value="Non-Ac Room">
                        Non-Ac Room
                    </option>
           
                </select>

                <button type="submit">
                    Book Now
                </button>

            </form>

        </div>
    </section>


    <script>
        const scriptURL =
"https://script.google.com/macros/s/AKfycbyTM7D9poTUaH2BKuVYkt8mWV7A6QUc4J5btJ3zCGYwRFhqOTRYHGzxF63NuC8OOdpawg/exec";

        const form = document.getElementById("bookingForm");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            fetch(scriptURL, {
                method: "POST",
                body: new FormData(form)
            })
            .then(() => {
                alert("Booking Submitted Successfully!");
                form.reset();
            })
            .catch((error) => {
                console.error(error);
                alert("Error submitting booking!");
            });
        });
    </script>
