<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png"
          href="images/logo/favicon.png">

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body class="admin-body">
<div class="admin-header">

    <div class="admin-logo">
        <img src="images/logo/logo.png" alt="Logo">
        <span>PSY Ladies Hostel</span>
    </div>

    <a href="admin-login.html" class="logout-btn">
        Logout
    </a>

</div>

</div>
</div>
<div class="dashboard-title">

<div class="admin-actions">

    <a href="https://docs.google.com/spreadsheets/d/15opjUcno6-IAItYMZ8_RTCOc35k9TNgFSauWgaESYCo/edit?usp=sharing"
